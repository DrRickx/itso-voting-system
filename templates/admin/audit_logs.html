{% extends "base.html" %}
{% block content %}
<!-- Logout button at the top right -->
<div class="flex justify-end mb-4">
  <a href="{{ url_for('admin_logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
    Logout
  </a>
</div>
<div class="bg-white rounded p-4">
  <h2 class="text-xl font-semibold mb-3">Audit Logs</h2>
  <div class="overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="text-left text-gray-600">
        <tr><th class="py-2">Timestamp</th><th>User</th><th>Action</th></tr>
      </thead>
      <tbody class="divide-y">
        {% for l in logs %}
          <tr>
            <td class="py-2">{{ l.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
            <td class="py-2">{{ l.user_type }}{% if l.user_id %} ({{ l.user_id }}){% endif %}</td>
            <td class="py-2">{{ l.action }}</td>
          </tr>
        {% else %}
          <tr><td colspan="3" class="py-4 text-gray-600">No logs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
