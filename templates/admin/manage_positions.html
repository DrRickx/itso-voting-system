{% extends "base.html" %}
{% block content %}
<!-- Logout button at the top right -->
<div class="flex justify-end mb-4">
  <a href="{{ url_for('admin_logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition">
    Logout
  </a>
</div>
<div class="grid md:grid-cols-2 gap-6">
  <div class="bg-white rounded-2xl shadow p-6">
    <h2 class="text-xl font-semibold mb-4">Add Position</h2>
    <form method="post" class="space-y-3">
      <div>
        <label class="text-sm font-medium">Position Name</label>
        <input name="name" class="mt-1 w-full border rounded-lg px-3 py-2" required />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-medium">Max Selection</label>
          <input type="number" name="max_selection" value="1" min="1" class="mt-1 w-full border rounded-lg px-3 py-2" required />
        </div>
        <div>
          <label class="text-sm font-medium">Eligible Year (optional)</label>
          <select name="eligible_year" class="mt-1 w-full border rounded-lg px-3 py-2">
            <option value="">All</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-medium">Category (optional)</label>
          <input name="category" class="mt-1 w-full border rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="text-sm font-medium">Sort Order</label>
          <input type="number" name="sort_order" value="0" class="mt-1 w-full border rounded-lg px-3 py-2" required />
        </div>
      </div>
      <button class="px-4 py-2 rounded-lg bg-blue-700 text-white hover:bg-blue-800">Add</button>
    </form>
  </div>

  <div class="bg-white rounded-2xl shadow p-6">
    <h2 class="text-xl font-semibold mb-4">Positions</h2>
    <div class="space-y-2">
      {% for p in positions %}
        <div class="flex items-center justify-between border rounded-xl p-3">
          <div class="text-sm">
            <div class="font-semibold">{{ p.name }}</div>
            <div class="text-gray-600">max {{ p.max_selection }}{% if p.eligible_year %} • Year {{ p.eligible_year }}{% endif %} • Sort {{ p.sort_order }}</div>
          </div>
          <form method="post" action="{{ url_for('delete_position', pid=p.id) }}" onsubmit="return confirm('Delete this position?')">
            <button class="px-3 py-1.5 rounded-lg border hover:bg-gray-50">Delete</button>
          </form>
        </div>
      {% else %}
        <div class="text-sm text-gray-600">No positions yet.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
